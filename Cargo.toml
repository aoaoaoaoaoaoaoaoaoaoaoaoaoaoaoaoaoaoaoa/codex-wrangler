[workspace]
members = [
  "crates/codex-wrangler",
  "crates/codex-wrangler-acceptance",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/codex-wrangler"
rust-version = "1.96"
version = "1.3.1"

[workspace.dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
brass_poolrooms = "0.13.6"
egui = "=0.36.1"
egui-tester = "0.9.7"
egui-tester-witness = "0.9.7"
egui-wgpu = "=0.36.1"
eternalist-apps = "0.7.6"
inotify = { version = "0.11.4", default-features = false }
memchr = "2.8.3"
nix = { version = "0.31.3", default-features = false, features = ["poll", "signal"] }
regex = "1.12.3"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.27"
sha2 = "0.11.0"
tempfile = "3.27.0"
x11rb = { version = "0.14.0", default-features = false, features = ["randr"] }

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features"]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]

[workspace.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []
