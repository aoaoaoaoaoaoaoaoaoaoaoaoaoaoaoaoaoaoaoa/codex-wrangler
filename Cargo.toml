[workspace]
members = [
  "crates/codex-wrangler",
  "crates/codex-wrangler-acceptance",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/codex-wrangler"
rust-version = "1.96"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1.0.102"
crossbeam-channel = "0.5.15"
dwemer_poolrooms = "0.9.2"
egui = "=0.34.3"
egui-tester = "0.6.2"
egui-tester-witness = "0.6.2"
egui-wgpu = "=0.34.3"
eternalist-apps = "0.3.3"
inotify = { version = "0.11.4", default-features = false }
memchr = "2.7.6"
nix = { version = "0.30.1", default-features = false, features = ["poll", "signal"] }
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
x11rb = { version = "0.13.2", default-features = false, features = ["randr"] }

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features"]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]

[workspace.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []
