[package]
name = "codex-wrangler"
version.workspace = true
description = "Linux/X11/i3 tray switcher for live coding-agent TUI sessions"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["codex", "claude", "i3", "x11", "egui"]
categories = ["gui"]

[features]
egui-test = [
  "dep:egui-tester-witness",
  "instrumentation",
  "eternalist-apps/egui-test",
]
instrumentation = ["dwemer_poolrooms/instrumentation"]

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
dwemer_poolrooms.workspace = true
egui.workspace = true
egui-tester-witness = { workspace = true, optional = true, features = ["egui"] }
egui-wgpu.workspace = true
eternalist-apps.workspace = true
memchr.workspace = true
nix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
x11rb.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
